[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indicjevbench"
version = "1.0.0"
description = "Benchmark for Indic structured decision AI"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["tqdm>=4.0", "httpx>=0.27"]

[project.optional-dependencies]
baselines = ["torch>=2.0", "transformers>=4.40", "openai>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
indicjevbench = "indicjevbench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
